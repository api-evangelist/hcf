actions:
  apisYmlUpdated: true
  apisListed: 0
  openapiDirectoryCreated: false
  reason: |
    No public, documented, self-serve API exists for HCF, so apis[] is intentionally
    empty and no openapi/ directory was created. Recording the absence accurately is
    the deliverable. Re-review is warranted only if the Consumer Data Right is
    reactivated for insurance, if HCF launches a partner or provider developer program,
    or if a health-data interoperability mandate reaches Australian private health
    insurers.
