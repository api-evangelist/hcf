name: HCF
kind: company
description: >-
  HCF — The Hospitals Contribution Fund of Australia Limited (ABN 68 000 026 746,
  AFSL 241 414), founded in 1932 and headquartered in Sydney — is Australia's
  largest not-for-profit health fund, covering over 2 million members. It
  underwrites private health insurance (hospital, extras and ambulance cover) and
  Overseas Visitors Health Cover, and distributes life and Recover Cover products
  (life protect, income protect, critical illness), travel, pet, home, car and
  landlord insurance, plus the Flip accidental-injury brand, alongside its own HCF
  dental and eyecare centres and the HCF Research Foundation. As a carrier in
  Australian private health insurance, HCF publishes NO public, self-serve
  developer API and no developer portal: probes of developer.hcf.com.au,
  developers.hcf.com.au and docs.hcf.com.au do not resolve, and /developers,
  /developer, /api-docs, /partners and /integrations on www.hcf.com.au all return
  404. Member and provider integration runs through channels HCF does not itself
  expose as an API — point-of-service extras claiming over third-party HICAPS VX,
  HICAPS Trinity and CommBank Smart Health terminals, Medicare Benefit Statements
  for medical gap claims, and the My Membership app and online member services
  behind an Okta-backed sign-in at id.hcf.com.au. No ACORD reference of any kind
  appears on the site, which is consistent with private health insurance sitting
  outside the general-insurance ACORD/AL3 world, and Australia's Consumer Data
  Right — designated for general insurance and then deferred — never reached
  health insurance at all. The record here is deliberately an honest stub: this is
  a partner-gated, no-public-API carrier.
